version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: defect-detection-web
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - KMP_DUPLICATE_LIB_OK=TRUE

  prometheus:
    image: prom/prometheus:latest
    container_name: defect-detection-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - web

  grafana:
    image: grafana/grafana:latest
    container_name: defect-detection-grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus

